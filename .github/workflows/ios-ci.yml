name: iOS CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App & Tests for iOS Simulator
        run: |
          xcodebuild clean build-for-testing \
            -scheme "SkyPulse-SwiftUI" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO